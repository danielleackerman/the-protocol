<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">The Protocol — Reality Control Panel</title>
  <desc id="desc">A simple README header inspired by the live Protocol website: ivory surface, navigation, and a Daily Run-style control card.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf7f0"/>
      <stop offset="100%" stop-color="#f0ebe3"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="30" flood-color="#6b5a45" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect width="1600" height="760" fill="url(#bg)"/>

  <g opacity=".42">
    <line x1="0" y1="86" x2="1600" y2="86" stroke="#d8d1c7" stroke-width="1"/>
    <line x1="0" y1="88" x2="1600" y2="88" stroke="#ffffff" stroke-width="1"/>
  </g>

  <text x="98" y="53" fill="#171411" font-family="Georgia, 'Times New Roman', serif" font-size="27" letter-spacing="2.5">THE PROTOCOL</text>

  <g font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="2">
    <rect x="430" y="21" width="118" height="44" rx="5" fill="#f6f2eb" stroke="#d5cabd"/>
    <text x="489" y="49" text-anchor="middle" fill="#6e6256">OVERVIEW</text>

    <rect x="568" y="21" width="142" height="44" rx="5" fill="#eee8df" stroke="#1d1914"/>
    <text x="639" y="49" text-anchor="middle" fill="#1d1914">QUICK RUNS</text>

    <rect x="730" y="21" width="106" height="44" rx="5" fill="#f6f2eb" stroke="#d5cabd"/>
    <text x="783" y="49" text-anchor="middle" fill="#6e6256">LEVELS</text>

    <rect x="856" y="21" width="136" height="44" rx="5" fill="#f6f2eb" stroke="#d5cabd"/>
    <text x="924" y="49" text-anchor="middle" fill="#6e6256">WORMHOLE</text>

    <rect x="1012" y="21" width="166" height="44" rx="5" fill="#f6f2eb" stroke="#d5cabd"/>
    <text x="1095" y="49" text-anchor="middle" fill="#6e6256">AGE REVERSAL</text>
  </g>

  <rect x="54" y="142" width="1492" height="432" rx="15" fill="#fffdf9" stroke="#d7d0c7" filter="url(#cardShadow)"/>

  <g transform="translate(98 196)">
    <text x="0" y="0" fill="#8b5a23" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="3">REALITY CONTROL PANEL</text>

    <text x="0" y="92" fill="#171411" font-family="Georgia, 'Times New Roman', serif" font-size="76" letter-spacing="-1.5">THE PROTOCOL</text>

    <text x="2" y="146" fill="#2d2925" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22">Identity change, made executable.</text>

    <text x="2" y="194" fill="#62594f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19">Change the file you are running — from reaction to command, from old defaults to chosen operating state.</text>

    <g transform="translate(0 236)" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-style="italic">
      <rect x="0" y="0" width="138" height="43" rx="4" fill="#fbf8f2" stroke="#bfb5a8"/>
      <text x="69" y="28" text-anchor="middle" fill="#171411">Enter</text>

      <rect x="154" y="0" width="142" height="43" rx="4" fill="#fbf8f2" stroke="#bfb5a8"/>
      <text x="225" y="28" text-anchor="middle" fill="#171411">Daily Run</text>

      <rect x="312" y="0" width="142" height="43" rx="4" fill="#fbf8f2" stroke="#bfb5a8"/>
      <text x="383" y="28" text-anchor="middle" fill="#171411">Breach</text>

      <rect x="470" y="0" width="142" height="43" rx="4" fill="#fbf8f2" stroke="#bfb5a8"/>
      <text x="541" y="28" text-anchor="middle" fill="#171411">Levels</text>
    </g>
  </g>

  <g transform="translate(1090 206)" font-family="'SF Mono', Menlo, Consolas, monospace">
    <rect x="0" y="0" width="350" height="286" rx="12" fill="#f8f3eb" stroke="#d6cbbd"/>
    <text x="32" y="48" fill="#8b5a23" font-size="12" font-weight="700" letter-spacing="2.4">OPERATING STATE</text>

    <text x="32" y="96" fill="#1d1914" font-size="18">OPERATOR SEATED</text>
    <line x1="32" y1="116" x2="318" y2="116" stroke="#d8d0c7"/>

    <text x="32" y="154" fill="#1d1914" font-size="18">SWITCHBOARD READY</text>
    <line x1="32" y1="174" x2="318" y2="174" stroke="#d8d0c7"/>

    <text x="32" y="212" fill="#1d1914" font-size="18">COMMAND LINE OPEN</text>
    <line x1="32" y1="232" x2="318" y2="232" stroke="#d8d0c7"/>

    <text x="32" y="262" fill="#8b5a23" font-size="12" font-weight="700" letter-spacing="2.2">BREACH SEALED · CONTINUE</text>
  </g>

  <text x="800" y="655" text-anchor="middle" fill="#8a8178" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" letter-spacing="2.2">☼ DEFAULTS RESTORED · SWITCHES ON · COMMAND ISSUED · CONFIRMATION RECEIVED</text>
</svg>
