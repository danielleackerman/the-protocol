<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">The Protocol — Reality Control Panel</title>
  <desc id="desc">A premium README hero plate for The Protocol: identity change made executable.</desc>

  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8f1e3"/>
      <stop offset="55%" stop-color="#efe3ce"/>
      <stop offset="100%" stop-color="#dcc5a3"/>
    </linearGradient>

    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a2119"/>
      <stop offset="100%" stop-color="#100d0a"/>
    </linearGradient>

    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2d08c"/>
      <stop offset="45%" stop-color="#b9853b"/>
      <stop offset="100%" stop-color="#6f481f"/>
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#2a1a0c" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1600" height="720" fill="url(#paper)"/>

  <rect x="70" y="58" width="1460" height="604" rx="34" fill="#f6eddd" stroke="#b78a4a" stroke-width="3"/>
  <rect x="102" y="90" width="1396" height="540" rx="26" fill="none" stroke="#2a2119" stroke-opacity=".18" stroke-width="2"/>

  <g opacity=".28">
    <path d="M150 170H1450" stroke="#6f481f" stroke-width="2"/>
    <path d="M150 550H1450" stroke="#6f481f" stroke-width="2"/>
    <path d="M258 90V630" stroke="#6f481f" stroke-width="1"/>
    <path d="M1342 90V630" stroke="#6f481f" stroke-width="1"/>
  </g>

  <g transform="translate(200 154)" filter="url(#softShadow)">
    <rect width="1200" height="400" rx="30" fill="url(#panel)" stroke="url(#bronze)" stroke-width="4"/>

    <rect x="38" y="36" width="1124" height="328" rx="22" fill="none" stroke="#caa46b" stroke-opacity=".32" stroke-width="2"/>

    <text x="600" y="92" text-anchor="middle" fill="#d5b06e" font-family="Georgia, 'Times New Roman', serif" font-size="24" letter-spacing="8">THE PROTOCOL</text>

    <text x="600" y="178" text-anchor="middle" fill="#fff4df" font-family="Georgia, 'Times New Roman', serif" font-size="82" letter-spacing="2">Reality Control Panel</text>

    <text x="600" y="232" text-anchor="middle" fill="#d9c4a2" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="25" letter-spacing="1">IDENTITY CHANGE, MADE EXECUTABLE</text>

    <g transform="translate(225 276)">
      <rect width="750" height="54" rx="27" fill="#f3dfba" fill-opacity=".10" stroke="#b9853b" stroke-opacity=".75"/>
      <text x="375" y="35" text-anchor="middle" fill="#f0d6a4" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="20" letter-spacing="1.5">OPERATOR SEATED · SWITCHBOARD READY · COMMAND LINE OPEN</text>
    </g>

    <g fill="#c99a52" font-family="Georgia, 'Times New Roman', serif" font-size="34">
      <text x="74" y="82">☼</text>
      <text x="1094" y="82">∴</text>
      <text x="74" y="334">⌁</text>
      <text x="1094" y="334">✦</text>
    </g>
  </g>

  <text x="800" y="606" text-anchor="middle" fill="#3a2a1c" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="20" letter-spacing="1.2">CHANGE THE FILE · AUTHORIZE THE STATE · RUN THE COMMAND</text>
</svg>
